[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; PHP-FPM — replaces `php spark serve`, which is PHP's single-threaded
; development server and is not safe under production load.
;
; No error-log flag here. php-fpm's -y is --fpm-config (a directory) and -e takes
; no argument; error_log is set in the MAIN /usr/local/etc/php-fpm.conf during
; the build. Passing it on the command line does not work.
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=iderm4u

; Caddy — serves /public/** and hands everything else to php-fpm.
;
; HOME is set explicitly. Without it the image's default HOME is /root, which
; iderm4u cannot write, and Caddy errors on every start with
; "mkdir /root/.config: permission denied" and
; "storage_clean.lock: permission denied".
;
; stderr_logfile is deliberately omitted: with redirect_stderr=true, setting
; both makes supervisor warn and ignore the filename.
[program:caddy]
command=/usr/bin/caddy run --config /application/Caddyfile --adapter caddyfile
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/iderm4u"
user=iderm4u