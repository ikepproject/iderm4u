[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; PHP-FPM — replaces `php spark serve`, which is PHP's single-threaded
; development server and is not safe under production load.
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=iderm4u

; Caddy — serves /public/** and hands everything else to php-fpm.
[program:caddy]
command=/usr/bin/caddy run --config /application/Caddyfile --adapter caddyfile
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stderr_logfile=/dev/stdout
user=iderm4u