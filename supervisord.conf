[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes = 0

[program:caddy]
; Caddy is a FILTER plus a RELAY: it refuses to serve paths that must
; never be public (.env, .git, the source trees, uploaded .php files) and
; relays everything else to the PHP process on 8081.
;
; The previous `caddy reverse-proxy --from :8080 --to localhost:8081`
; had no configuration at all, so every path was relayed straight to PHP
; — including /.env, which the PHP dev server happily returns as
; plaintext because it exists on disk.
;
; HOME is set explicitly. Without it the image's default HOME is /root,
; which iderm4u cannot write, and Caddy errors on every start with
; "mkdir /root/.config: permission denied".
;
; stderr_logfile is deliberately omitted: with redirect_stderr=true,
; setting both makes supervisor warn and ignore the filename.
command=caddy run --config /application/Caddyfile --adapter caddyfile
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/iderm4u"
user=iderm4u

[program:iderm4u]
command=php spark serve --port 8081
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
user=iderm4u